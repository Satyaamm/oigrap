version: "3.9"

services:
  oigrap:
    build: .
    ports:
      - "7432:7432"
    volumes:
      - oigrap_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7432 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  oigrap_data:
